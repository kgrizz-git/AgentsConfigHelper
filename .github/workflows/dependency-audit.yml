# Two read-only, failing checks:
# - osv-scan: OSV-Scanner over every lockfile (today pubspec.lock).
# - vulnerable-actions: zizmor's known-vulnerable-actions audit over the
#   workflows. Actions here are pinned by commit SHA, and Dependabot alerts
#   only cover semver-tag references, so pinned actions are checked here.
# Cost: ~4-6 runs/month x ~1 Linux minute per job.

name: Dependency vulnerability audit

on:
  # Weekly on Monday at 06:17 UTC, so a newly published advisory against a
  # locked dependency turns CI red without waiting for a PR or Dependabot.
  schedule:
    - cron: '17 6 * * 1'
  # Manual rerun from the Actions tab.
  workflow_dispatch:
  # Gate PRs that change the lockfile (or this workflow) only.
  pull_request:
    paths:
      - 'pubspec.lock'
      - 'pubspec.yaml'
      - '.github/workflows/dependency-audit.yml'

permissions:
  contents: read

jobs:
  osv-scan:
    name: OSV-Scanner (lockfiles)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Recursively scans every lockfile in the checkout (today: pubspec.lock)
      # against osv.dev. Paths matched by .gitignore (build/, .dart_tool/,
      # node_modules/, ...) are skipped. Exits non-zero on any known
      # vulnerability, failing the job.
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            -r
            ./

  # Dependabot alerts are never raised for actions pinned by commit SHA (only
  # for semver tags), so check pinned actions against GitHub's advisory
  # database here. zizmor resolves each SHA to its release tag. Only the
  # known-vulnerable-actions audit fails the job; other zizmor findings are
  # out of scope for this check.
  vulnerable-actions:
    name: Known-vulnerable actions (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install zizmor
        run: "pip install --only-binary=:all: zizmor==1.31.0"
      - name: Check actions against GitHub security advisories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Without a token zizmor silently skips its online audits (including
          # known-vulnerable-actions) and would pass; fail closed instead.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_TOKEN is empty; zizmor would skip its online audits"
            exit 1
          fi
          set +e
          zizmor --format=json . > zizmor.json
          rc=$?
          set -e
          # 0 = no findings, 10-14 = findings by severity; anything else
          # (e.g. 1) means the audit itself failed, which must not pass.
          if [ "$rc" -ne 0 ] && { [ "$rc" -lt 10 ] || [ "$rc" -gt 14 ]; }; then
            echo "::error::zizmor failed (exit $rc)"
            exit 1
          fi
          python3 - <<'PY'
          import json
          import sys

          findings = [
              f for f in json.load(open("zizmor.json"))
              if f["ident"] == "known-vulnerable-actions" and not f.get("ignored")
          ]
          for f in findings:
              loc = (f.get("locations") or [{}])[0]
              key = loc.get("symbolic", {}).get("key", {})
              path = key.get("Local", {}).get("verbatim_path", "?") if isinstance(key, dict) else "?"
              line = loc.get("concrete", {}).get("location", {}).get("start_point", {}).get("row", 0) + 1
              note = loc.get("symbolic", {}).get("annotation", "")
              print(f"::error file={path},line={line}::{f['desc']}: {note}")
          print(f"{len(findings)} known-vulnerable action reference(s)")
          sys.exit(1 if findings else 0)
          PY
