name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.9"
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: dart run dart_code_linter:metrics analyze lib --set-exit-on-violation-level=warning

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.9"
          cache: true

      - run: flutter pub get
      - run: flutter test --coverage
      - name: Check coverage (min 80%, excluding vendor)
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import PurePosixPath

          total = covered = 0
          include = True
          with open("coverage/lcov.info") as handle:
              for line in handle:
                  if line.startswith("SF:"):
                      source_path = PurePosixPath(line[3:].strip().replace("\\", "/"))
                      include = "vendor" not in source_path.parts
                  elif include and line.startswith("DA:"):
                      hits = int(line[3:].strip().split(",")[1])
                      total += 1
                      covered += 1 if hits > 0 else 0

          if total == 0:
              sys.exit(
                  "No coverable lines found in coverage/lcov.info "
                  "(empty, unrecognized, or vendor-only report)"
              )
          pct = covered / total * 100
          print(f"Line coverage: {pct:.2f}% ({covered}/{total})")
          if pct < 80:
              sys.exit(f"Coverage {pct:.2f}% is below the minimum of 80%")
          PY

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # `--only-binary :all:` forbids source builds, so no dependency's setup
      # script runs during install (supply-chain hardening; Sonar S8541).
      - run: "pip install --only-binary :all: semgrep==1.173.0"

      # Non-blocking: no `--error`, so findings surface in the Security tab
      # without failing the PR. `--metrics off` keeps the scan telemetry-free.
      # Strongest coverage is Python/shell/workflow YAML; Dart is Beta-maturity.
      - run: semgrep scan --config p/default --metrics off --sarif --output semgrep.sarif

      - uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  macos-entitlements:
    name: macOS entitlements (no App Sandbox)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert App Sandbox is absent from entitlements and project metadata
        run: |
          set -euo pipefail
          sandbox_key="com.apple.security.app-sandbox"
          failed=0
          for entitlements in macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements; do
            if [ ! -f "$entitlements" ]; then
              echo "::error file=$entitlements::Missing entitlements file"
              failed=1
              continue
            fi
            if ! plutil -lint "$entitlements" >/dev/null; then
              echo "::error file=$entitlements::Entitlements file is not a valid property list"
              failed=1
              continue
            fi
            if plutil -p "$entitlements" 2>/dev/null | grep -qx "  \"$sandbox_key\" => .*"; then
              echo "::error file=$entitlements::App Sandbox must be removed ($sandbox_key present)"
              failed=1
            else
              echo "OK: $entitlements omits $sandbox_key"
            fi
          done
          project_file="macos/Runner.xcodeproj/project.pbxproj"
          if grep -Fq 'com.apple.Sandbox' "$project_file"; then
            echo "::error file=$project_file::App Sandbox capability metadata must be removed"
            failed=1
          else
            echo "OK: $project_file omits App Sandbox capability metadata"
          fi
          exit "$failed"

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.9"
          cache: true

      - run: flutter pub get

      - if: matrix.os == 'macos-latest'
        run: flutter build macos --release

      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
          flutter build linux --release

      - if: matrix.os == 'windows-latest'
        run: flutter build windows --release
