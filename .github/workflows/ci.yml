name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.1"
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter pub run dart_code_linter:metrics analyze lib --set-exit-on-violation-level=warning

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.1"
          cache: true

      - run: flutter pub get
      - run: flutter test --coverage
      - name: Check coverage (min 80%, excluding vendor)
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import PurePosixPath

          total = covered = 0
          include = True
          with open("coverage/lcov.info") as handle:
              for line in handle:
                  if line.startswith("SF:"):
                      source_path = PurePosixPath(line[3:].strip().replace("\\", "/"))
                      include = "vendor" not in source_path.parts
                  elif include and line.startswith("DA:"):
                      hits = int(line[3:].strip().split(",")[1])
                      total += 1
                      covered += 1 if hits > 0 else 0

          if total == 0:
              sys.exit(
                  "No coverable lines found in coverage/lcov.info "
                  "(empty, unrecognized, or vendor-only report)"
              )
          pct = covered / total * 100
          print(f"Line coverage: {pct:.2f}% ({covered}/{total})")
          if pct < 80:
              sys.exit(f"Coverage {pct:.2f}% is below the minimum of 80%")
          PY

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: Docs integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Deterministic, offline, no network: internal relative-link check plus the
      # doc-link checker's stdlib-unittest suite. The supported-tool catalog
      # review-marker and registry-coverage gate (--catalog-strict) runs here too;
      # it activates now that the truthful "Catalog reviewed through:" marker is
      # present in docs/supported-tools.md. External network probing remains
      # disabled (--internal-only); only missing/malformed markers and missing
      # registry tools are strict failures (a stale date stays advisory).
      - name: Internal link + catalog check
        run: python3 ci/scripts/check_doc_links.py --internal-only --catalog-strict

      - name: Doc-link checker unit tests
        run: python3 ci/tests/test_check_doc_links.py

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # `--only-binary :all:` forbids source builds, so no dependency's setup
      # script runs during install (supply-chain hardening; Sonar S8541).
      - run: "pip install --only-binary :all: semgrep==1.173.0"

      # Non-blocking: no `--error`, so findings surface in the Security tab
      # without failing the PR. `--metrics off` keeps the scan telemetry-free.
      # Strongest coverage is Python/shell/workflow YAML; Dart is Beta-maturity.
      - run: semgrep scan --config p/default --metrics off --sarif --output semgrep.sarif

      - uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  macos-entitlements:
    name: macOS entitlements (no App Sandbox)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert App Sandbox is absent from entitlements and project metadata
        run: |
          set -euo pipefail
          sandbox_key="com.apple.security.app-sandbox"
          failed=0
          project_file="macos/Runner.xcodeproj/project.pbxproj"
          if [ ! -f "$project_file" ] || [ ! -r "$project_file" ]; then
            echo "::error file=$project_file::Project file is missing or unreadable"
            failed=1
          elif grep -Fq -- 'com.apple.Sandbox' "$project_file"; then
            echo "::error file=$project_file::App Sandbox capability metadata must be removed"
            failed=1
          else
            grep_status=$?
            if [ "$grep_status" -eq 1 ]; then
              echo "OK: $project_file omits App Sandbox capability metadata"
            else
              echo "::error file=$project_file::Unable to inspect project metadata"
              failed=1
            fi
          fi
          if ! entitlements_paths=$(awk '
            /^[[:space:]]*CODE_SIGN_ENTITLEMENTS[[:space:]]*=/ {
              value = $0
              sub(/^[[:space:]]*CODE_SIGN_ENTITLEMENTS[[:space:]]*=[[:space:]]*/, "", value)
              sub(/[[:space:]]*;[[:space:]]*$/, "", value)
              print value
            }
          ' "$project_file" | sort -u); then
            echo "::error file=$project_file::Unable to read CODE_SIGN_ENTITLEMENTS values"
            failed=1
          elif [ -z "$entitlements_paths" ]; then
            echo "::error file=$project_file::No CODE_SIGN_ENTITLEMENTS values found"
            failed=1
          else
            while IFS= read -r entitlement_path; do
              case "$entitlement_path" in
                ""|/*|*..*|*[!A-Za-z0-9._/-]*)
                  echo "::error file=$project_file::Unsupported CODE_SIGN_ENTITLEMENTS path"
                  failed=1
                  continue
                  ;;
              esac
              entitlements="macos/$entitlement_path"
              if [ ! -f "$entitlements" ] || [ ! -r "$entitlements" ]; then
                echo "::error file=$entitlements::Missing or unreadable entitlements file"
                failed=1
                continue
              fi
              if ! plutil -lint "$entitlements" >/dev/null; then
                echo "::error file=$entitlements::Entitlements file is not a valid property list"
                failed=1
                continue
              fi
              if /usr/libexec/PlistBuddy -c "Print :$sandbox_key" "$entitlements" >/dev/null 2>&1; then
                echo "::error file=$entitlements::App Sandbox must be removed ($sandbox_key present)"
                failed=1
              else
                plistbuddy_status=$?
                if [ "$plistbuddy_status" -eq 1 ]; then
                  echo "OK: $entitlements omits $sandbox_key"
                else
                  echo "::error file=$entitlements::Unable to inspect App Sandbox entitlement"
                  failed=1
                fi
              fi
            done <<<"$entitlements_paths"
          fi
          exit "$failed"

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.1"
          cache: true

      - run: flutter pub get

      - if: matrix.os == 'macos-latest'
        run: flutter build macos --release

      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
          flutter build linux --release

      - if: matrix.os == 'windows-latest'
        run: flutter build windows --release
