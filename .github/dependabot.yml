version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 11 20 * *" # 11:00 Eastern on the 20th of each month
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 11 20 * *" # 11:00 Eastern on the 20th of each month
      timezone: "America/New_York"
    cooldown:
      default-days: 3
