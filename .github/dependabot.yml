version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 15 * *" # 09:00 UTC on the 15th of each month
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 15 * *" # 09:00 UTC on the 15th of each month
    cooldown:
      default-days: 3
