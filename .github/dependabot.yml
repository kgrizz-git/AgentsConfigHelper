version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 11 20 * *" # 11:00 Eastern on the 20th of each month
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      pub-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          # Kept out of the broad group: their minor bumps are breaking and the
          # pair must move together (see plans/active/native-windowing-and-sdk-upgrade.md).
          - "window_manager"
          - "screen_retriever"
        update-types:
          - "minor"
          - "patch"
      pub-windowing-nativeapi:
        applies-to: version-updates
        patterns:
          - "window_manager"
          - "screen_retriever"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 11 20 * *" # 11:00 Eastern on the 20th of each month
      timezone: "America/New_York"
    cooldown:
      default-days: 7
    groups:
      actions-bumps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
