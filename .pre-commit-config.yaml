# Pre-commit hooks for AgentsConfigHelper (Flutter/Dart desktop app)
#
# Setup:
#   pip install pre-commit && pre-commit install
#
# Run manually:
#   pre-commit run --all-files

repos:
  # ── Secret scanning (always on) ────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: "secrets: gitleaks scan"

  # ── General file hygiene ───────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=5120]
        name: "size: large file gate"
      - id: detect-private-key
        name: "secrets: private key detect"
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-json
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]

  # ── Markdown ───────────────────────────────────────────────────────────────
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        name: "docs: markdownlint"
        args:
          - --disable
          - MD013
          - MD033
          - --

  # ── Shell ──────────────────────────────────────────────────────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        name: "shell: shellcheck"

  - repo: local
    hooks:
      - id: check-absolute-paths
        name: "security: check absolute paths"
        entry: hooks/scripts/check_absolute_paths.sh
        language: script
      - id: check-file-length
        name: "style: check file length"
        entry: hooks/scripts/check_file_length.sh
        language: script
        types: [dart]
      - id: dart-code-linter
        name: "dart: code linter metrics"
        # Run Flutter with git worktree-context cleared (see hooks/scripts/flutter_env.py).
        # In a linked worktree, `git commit` exports GIT_DIR/GIT_WORK_TREE, which redirect
        # Flutter's SDK git detection at the app checkout and break pub resolution.
        entry: python hooks/scripts/flutter_env.py metrics
        language: python
        pass_filenames: false

      # ── Pre-push only: slower checks that mirror CI's "Analyze & format"
      # and "Tests" jobs. Kept out of pre-commit so day-to-day commits stay
      # fast; run once before code leaves the machine instead.
      - id: dart-format-check
        name: "dart: format check (pre-push)"
        entry: dart format --output=none --set-exit-if-changed .
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: flutter-analyze
        name: "dart: flutter analyze (pre-push)"
        entry: python hooks/scripts/flutter_env.py analyze
        language: python
        pass_filenames: false
        stages: [pre-push]
      - id: flutter-test
        name: "dart: flutter test (pre-push)"
        entry: python hooks/scripts/flutter_env.py test
        language: python
        pass_filenames: false
        stages: [pre-push]
