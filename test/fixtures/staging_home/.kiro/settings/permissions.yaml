# Synthetic Kiro permissions example for tests.
rules:
  - capability: shell
    match:
      - "git *"
      - "npm *"
    exclude:
      - "git push *"
    effect: allow
  - capability: fs_read
    match:
      - "**/.env"
      - "**/*.pem"
    effect: deny
  - capability: web_fetch
    effect: ask
  - capability: context
    effect: evaluate
